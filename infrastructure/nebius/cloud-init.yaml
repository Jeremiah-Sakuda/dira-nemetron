#cloud-config
package_update: true
packages: [docker.io, docker-compose-v2, git, postgresql-client, gettext-base]
users:
  - name: dira
    groups: [docker]
    shell: /bin/bash
    sudo: ["ALL=(ALL) NOPASSWD:/usr/bin/systemctl"]
runcmd:
  - systemctl enable --now docker
  - sudo -u dira git clone https://github.com/Jeremiah-Sakuda/dira-nemetron.git /home/dira/dira
  - install -d -o dira -m 700 /home/dira/backups
  - echo '15 3 * * * dira /home/dira/dira/infrastructure/nebius/backup.sh >> /home/dira/backups/backup.log 2>&1' > /etc/cron.d/dira-backup
