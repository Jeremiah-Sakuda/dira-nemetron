# Reference: measured NemoHermes 0.0.135 / OpenShell 0.0.116 image.
# JSON is valid YAML. Do not blindly replace another runtime's generated policy.
# setup-hermes.sh preserves generated filesystem/process rules, narrows network
# access, then uses managed mcp add for credentials, pins and protocol rules.
# Do not overlap REST and MCP entries on one host/port; the runtime rejects it.
# An allowed executable ancestor authorizes child connections; host/method/path
# and MCP tool restrictions still apply. Standalone unlisted curl was denied.
# Keep immutable mirrored Skills under a read-only root such as /opt/hermes.
# /sandbox remains writable runtime state. Never put provider keys there.
{
  "filesystem_policy": {
    "include_workdir": true,
    "read_only": [
      "/usr",
      "/lib",
      "/opt/hermes",
      "/proc",
      "/dev/urandom",
      "/app",
      "/run/nemoclaw/managed-gateway-expected-exit",
      "/etc",
      "/var/log",
      "/var/lib/dpkg"
    ],
    "read_write": [
      "/sandbox",
      "/tmp",
      "/dev/null",
      "/dev/pts",
      "/sandbox/.hermes"
    ]
  },
  "landlock": {
    "compatibility": "best_effort"
  },
  "network_policies": {
    "managed_inference": {
      "binaries": [
        {
          "path": "/usr/local/bin/hermes"
        },
        {
          "path": "/usr/bin/python3.13"
        },
        {
          "path": "/opt/hermes/.venv/bin/python"
        }
      ],
      "endpoints": [
        {
          "enforcement": "enforce",
          "host": "inference.local",
          "port": 443,
          "protocol": "rest",
          "rules": [
            {
              "allow": {
                "method": "POST",
                "path": "/v1/chat/completions"
              }
            },
            {
              "allow": {
                "method": "POST",
                "path": "/v1/messages"
              }
            },
            {
              "allow": {
                "method": "POST",
                "path": "/v1/responses"
              }
            },
            {
              "allow": {
                "method": "POST",
                "path": "/v1/completions"
              }
            },
            {
              "allow": {
                "method": "POST",
                "path": "/v1/embeddings"
              }
            },
            {
              "allow": {
                "method": "GET",
                "path": "/v1/models"
              }
            },
            {
              "allow": {
                "method": "GET",
                "path": "/v1/models/**"
              }
            }
          ]
        }
      ],
      "name": "managed_inference"
    }
  },
  "process": {
    "run_as_group": "sandbox",
    "run_as_user": "sandbox"
  },
  "version": 1
}
